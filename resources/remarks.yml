INCLUDE-RECOMMEND-RANGE-INDEX: |-
  This function benefits from the use of a range index. For more information, see [range indexes](/azure/cosmos-db/index-policy#includeexclude-strategy).
INCLUDE-NOTIFY-NO-INDEX-USAGE: |-
  This function doesn't utilize the index.
INCLUDE-NOTIFY-BINDING-STATIC: |-
  Static versions of system functions only get their respective values once during binding, rather than execute repeatedly in the runtime as is the case for the nonstatic versions of the same functions.
INCLUDE-DATE-FORMAT-ISO-8601-UNDEFINED: |-
  This function returns `undefined` if the date and time isn't a valid **ISO 8601** date and time string.
INCLUDE-DATE-FORMAT-ISO-8601-PARTS: |-
  The **ISO 8601** date format specifies valid date and time parts to use with this function:
  | | Format |
  | --- | --- |
  | **Year** | `year`, `yyyy`, `yy` |
  | **Month** | `month`, `mm`, `m` |
  | **Day** | `day`, `dd`, `d` |
  | **Hour** | `hour`, `hh` |
  | **Minute** | `minute`, `mi`, `n` |
  | **Second** | `second`, `ss`, `s` |
  | **Millisecond** | `millisecond`, `ms` |
  | **Microsecond** | `microsecond`, `mcs` |
  | **Nanosecond** | `nanosecond`, `ns` |
