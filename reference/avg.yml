### YamlMime:NoSQLQueryReference
name: AVG
group: aggregation
description: |-
  The `AVG` function calculates the average of the values in the expression.
syntax: |-
  AVG(<numeric_expr>)
arguments:
  - name: numeric_expr
    required: true
    description: A numeric expression to calculate the average from.
returns: |-
  Returns a numeric scalar value.
examplesSample:
  set: products
  query: |-
    SELECT
      p.name,
      p.price,
      p.detailCategory
    FROM
      products p
    WHERE
      p.detailCategory = "apparel-accessories-watches"
examples:
  - title: Average value for a single property
    description: In this example, the `AVG` function is used to average the values of the `price` property into a single aggregated value.
    query: |-
      SELECT
        AVG(p.price) AS averagePrice
      FROM
        products p
      WHERE
        p.detailCategory = "apparel-accessories-watches"
    result: |-
      [
        {
          "averagePrice": 101.5
        }
      ]
remarks:
  - This function benefits from the use of a range index. For more information, see [range indexes](/azure/cosmos-db/index-policy#includeexclude-strategy).
  - If any arguments in `AVG` are string, boolean, or null; the entire aggregation system function returns `undefined`.
  - If any argument has an `undefined` value, that specific value isn't included in the `AVG` calculation.
related:
  - reference: count.yml
  - reference: sum.yml
