### YamlMime:NoSQLQueryReference
name: OBJECTTOARRAY
group: array
description: |-
  The `OBJECTTOARRAY` function converts field/value pairs in a JSON object to a JSON array.
syntax: |-
  OBJECTTOARRAY(<object_expr> [, <string_expr_1>, <string_expr_2>])
arguments:
  - name: object_expr
    required: true
    description: An object expression with properties in field/value pairs.
  - name: string_expr_1
    required: false
    description: A string expression with a name for the field representing the *field* portion of the original field/value pair.
  - name: string_expr_2
    required: false
    description: A string expression with a name for the field representing the *value* portion of the original field/value pair.
returns: |-
  Returns an array of elements with two fields, either `k` and `v` or custom-named fields.
examples:
  - title: Convert object to array
    description: In this example, the `OBJECTTOARRAY` function is used to convert a JSON object to an array.
    query: |-
      SELECT VALUE
        OBJECTTOARRAY({
          "a": "12345",
          "b": "67890"
        })
    result: |-
      [
        [
          {
            "k": "a",
            "v": "12345"
          },
          {
            "k": "b",
            "v": "67890"
          }
        ]
      ]
remarks: []
related:
  - reference: array-contains.yml
  - reference: array-length.yml
