name: ABS
group: mathematical
description: |-
  The `ABS` function calculates the absolute (positive) value of the specified numeric expression.
syntax: |-
  ABS(<numeric_expr>)
arguments:
  - name: numeric_expr
    required: true
    description: A numeric expression.
argumentsNote: |-
  The `ARRAY_CONCAT`` function requires at least two array expression arguments.
returns: |-
  Returns a numeric expression.
examples:
  - title: Absolute value of numbers
    description: In this example, the `ABS` function is used on negative, zero, and positive numbers.
    query: |-
      SELECT VALUE { 
        absoluteNegativeOne: ABS(-1),
        absoluteZero: ABS(0),
        absoluteOne: ABS(1) 
      }
    result: |-
      [
        {
          "absoluteNegativeOne": 1,
          "absoluteZero": 0,
          "absoluteOne": 1
        }
      ]
remarks:
  - INCLUDE-RECOMMEND-RANGE-INDEX
related:
  - reference: is-number.yml
