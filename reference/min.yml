### YamlMime:NoSQLQueryReference
name: MIN
group: aggregation
description: |
  The `MIN` function returns the minimum value of the specified expression.
syntax: |
  MIN(<numeric_expr>)
arguments:
  - name: numeric_expr
    required: true
    description: A numeric expression.
returns: |
  Returns a numeric scalar value.
examples:
  - title: Minimum value for a property
    description: In this example, the `MIN` function is used to return the minimum value of the `price` property.
    query: |
      SELECT
        MIN(p.price) AS minPrice
      FROM 
        products p
      WHERE
        p.category = "fashion-bracelet"
    result: |
      [
        {
          "minPrice": 27.6
        }
      ]
remarks: []
related:
  - reference: max.yml
  - reference: avg.yml
