### YamlMime:NoSQLQueryReference
name: LTRIM
group: string
summary: An Azure Cosmos DB for NoSQL system function that returns a string expression with leading whitespace or specified characters removed.
description: |
  The `LTRIM` function returns a string expression after it removes leading whitespace or specified characters.
syntax: |
  LTRIM(<string_expr_1> [, <string_expr_2>])
arguments:
  - name: string_expr_1
    required: true
    description: A string expression.
  - name: string_expr_2
    required: false
    description: An optional string expression to be trimmed from `string_expr_1`. If not set, the default is to trim whitespace.
returns: |
  Returns a string expression.
examples:
  - title: Remove leading whitespace or characters
    description: In this example, the `LTRIM` function is used with various parameters inside a query.
    query: |
      SELECT VALUE {
        whitespaceStart: LTRIM("  AdventureWorks"),
        whitespaceStartEnd: LTRIM("  AdventureWorks  "),
        whitespaceEnd: LTRIM("AdventureWorks  "),
        noWhitespace: LTRIM("AdventureWorks"),
        trimSuffix: LTRIM("AdventureWorks", "Works"),
        trimPrefix: LTRIM("AdventureWorks", "Adventure"),
        trimEntireTerm: LTRIM("AdventureWorks", "AdventureWorks"),
        trimEmptyString: LTRIM("AdventureWorks", "")
      }
    result: |
      [
        {
          "whitespaceStart": "AdventureWorks",
          "whitespaceStartEnd": "AdventureWorks  ",
          "whitespaceEnd": "AdventureWorks  ",
          "noWhitespace": "AdventureWorks",
          "trimSuffix": "AdventureWorks",
          "trimPrefix": "Works",
          "trimEntireTerm": "",
          "trimEmptyString": "AdventureWorks"
        }
      ]
remarks:
  - This function doesn't utilize the index.
related:
  - reference: rtrim.yml
  - reference: trim.yml
