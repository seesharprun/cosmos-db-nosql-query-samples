### YamlMime:NoSQLQueryReference
name: NUMBERBIN
group: mathematical
description: |
  The `NUMBERBIN` function calculates the input value rounded to a multiple of the specified size.
syntax: |
  NUMBERBIN(<numeric_expr> [, <bin_size>])
arguments:
  - name: numeric_expr
    required: true
    description: A numeric expression, which is evaluated and then the resulting value is rounded to a multiple of the specified bin size.
  - name: bin_size
    required: false
    description: A numeric value that specifies the bin size to use when rounding the value. This numeric value defaults to `1` if not specified.
returns: |
  Returns a numeric value.
examples:
  - title: Bin a number with various bin sizes
    description: In this example, the `NUMBERBIN` function is used to round a number to various bin sizes.
    query: |
      SELECT VALUE {
        roundToNegativeHundreds: NUMBERBIN(37.752, -100),
        roundToTens: NUMBERBIN(37.752, 10),
        roundToOnes: NUMBERBIN(37.752, 1),
        roundToZeroes: NUMBERBIN(37.752, 0),
        roundToOneTenths: NUMBERBIN(37.752, 0.1),
        roundToOneHundreds: NUMBERBIN(37.752, 0.01)
      }
    result: |
      [
        {
          "roundToNegativeHundreds": 100,
          "roundToTens": 30,
          "roundToOnes": 37,
          "roundToOneTenths": 37.7,
          "roundToOneHundreds": 37.75
        }
      ]
system:
  - SKIP-VALIDATION
remarks: []
related:
