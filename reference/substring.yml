### YamlMime:NoSQLQueryReference
name: SUBSTRING
group: string
summary: An Azure Cosmos DB for NoSQL system function that returns a portion of a string using a starting position and length.
description: |
  The `SUBSTRING` function returns part of a string expression starting at the specified position and of the specified length, or to the end of the string.
syntax: |
  SUBSTRING(<string_expr>, <numeric_expr_1>, <numeric_expr_2>)
arguments:
  - name: string_expr
    required: true
    description: A string expression.
  - name: numeric_expr_1
    required: true
    description: A numeric expression to denote the start character.
  - name: numeric_expr_2
    required: true
    description: A numeric expression to denote the maximum number of characters of `string_expr` to be returned.
returns: |
  Returns a string expression.
examples:
  - title: Extract substrings from a string
    description: In this example, the `SUBSTRING` function is used to return substrings with various lengths and starting positions.
    query: |
      SELECT VALUE {
        substringPrefix: SUBSTRING("AdventureWorks", 0, 9),
        substringSuffix: SUBSTRING("AdventureWorks", 9, 5),
        substringTotalLength: SUBSTRING("AdventureWorks", 0, LENGTH("AdventureWorks")),
        substringEmptyString: SUBSTRING("AdventureWorks", 0, -1)
      }
    result: |
      [
        {
          "substringPrefix": "Adventure",
          "substringSuffix": "Works",
          "substringTotalLength": "AdventureWorks",
          "substringEmptyString": ""
        }
      ]
remarks:
  - This function benefits from the use of a range index. For more information, see [range indexes](/azure/cosmos-db/index-policy#includeexclude-strategy).
related:
