name: SUM
group: aggregation
description: |-
  The `SUM` function calculates the sum of the values in the expression.
syntax: |-
  SUM(<numeric_expr>)
arguments:
  - name: numeric_expr
    required: true
    description: A numeric expression to sum.
returns: |-
  Returns a numeric scalar value.
examples:
  sample:
    set: products
    query: |-
      SELECT
        p.name,
        p.quantity,
        p.category
      FROM
        products p
      WHERE
        p.category = "hiking-bags"
  items:
    - title: Sum values for a single property
      description: In this example, the `SUM` function is used to sum the values of the `quantity` property into a single aggregated value.
      query: |-
        SELECT VALUE
            SUM(p.quantity)
        FROM
            products p
        WHERE
            p.category = "hiking-bags"
      result: |-
        [
          50
        ]
remarks:
  - STATIC-RECOMMEND-RANGE-INDEX
  - If any arguments in `SUM` are string, boolean, or null; the entire aggregate system function returns `undefined`.
  - If any individual argument has an `undefined` value, that value isn't included in the `SUM` calculation.
related:
  - reference: avg.yml
  - reference: count.yml
