### YamlMime:NoSQLQueryReference
name: MAX
group: aggregation
description: |
  The `MAX` function returns the maximum value of the specified expression.
syntax: |
  MAX(<numeric_expr>)
arguments:
  - name: numeric_expr
    required: true
    description: A numeric expression.
returns: |
  Returns a numeric scalar value.
examples:
  - title: Maximum value for a property
    description: In this example, the `MAX` function is used to return the maximum value of the `price` property.
    query: |
      SELECT
        MAX(p.price) AS maxPrice
      FROM 
        products p
      WHERE
        p.category = "activity-bracelet"
    result: |
      [
        {
          "maxPrice": 71.76
        }
      ]
remarks: []
related:
