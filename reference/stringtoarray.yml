### YamlMime:NoSQLQueryReference
name: STRINGTOARRAY
group: string
summary: An Azure Cosmos DB for NoSQL system function that returns a string expression converted to an array.
description: |
  The `STRINGTOARRAY` function converts a string expression to an array.
syntax: |
  STRINGTOARRAY(<string_expr>)
arguments:
  - name: string_expr
    required: true
    description: A string expression.
returns: |
  Returns an array.
examples:
  - title: Convert string to array
    description: In this example, the `STRINGTOARRAY` function is used to parse various string values into arrays.
    query: |
      SELECT VALUE {
        parseEmptyArray: STRINGTOARRAY("[]"),
        parseArray: STRINGTOARRAY('[ "coats", "gloves", "hats" ]'),
        complexArray: STRINGTOARRAY('[ { "types": [ "coats", "gloves" ] }, [ "hats" ], 76, false, null ]'),
        nestedArray: STRINGTOARRAY('[ [ "coats", "gloves" ], [ "hats" ] ]'),
        invalidArray: STRINGTOARRAY("[ 'coats', 'gloves', 'hats' ]"),
        parseUndefined: STRINGTOARRAY(undefined),
        parseNull: STRINGTOARRAY(null)
      }
    result: |
      [
        {
          "parseEmptyArray": [],
          "parseArray": [ "coats", "gloves", "hats" ],
          "complexArray": [
            {
              "types": [ "coats", "gloves" ]
            },
            [ "hats" ],
            76,
            false,
            null
          ],
          "nestedArray": [
            [ "coats", "gloves" ],
            [ "hats" ]
          ]
        }
      ]
remarks:
  - INCLUDE-NOTIFY-NO-INDEX-USAGE
related:
  - reference: stringtoobject.yml
  - reference: tostring.yml
