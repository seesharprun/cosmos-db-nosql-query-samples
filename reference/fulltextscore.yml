### YamlMime:NoSQLQueryReference
name: FULLTEXTSCORE
group: full-text-search
description: |-
  The `FULLTEXTSCORE` function returns a BM25 score value that can only be used in an `ORDER BY RANK` clause to sort results from highest relevancy to lowest relevancy of the specified terms.
syntax: |-
  FULLTEXTSCORE(<property_path>, <string_expr1>, <string_expr2>, ...)
arguments:
  - name: property_path
    required: true
    description: The property path to search.
  - name: string_expr1
    required: true
    description: The first term to find.
  - name: string_expr2
    required: false
    description: The second term to find.
returns: |-
  Returns a BM25 scoring that can be used with `ORDER BY RANK` or `RRF`.
examples:
  - title: Full text score with ORDER BY RANK
    description: In this example, the `FULLTEXTSCORE` function is used with `ORDER BY RANK` to sort from highest relevancy to lowest relevancy.
    query: |-
      SELECT TOP 10 c.text
      FROM c
      ORDER BY RANK FULLTEXTSCORE(c.text, "keyword")
    result: |-
      -- Example result not available (result not provided in markdown)
  - title: Full text score with WHERE and ORDER BY RANK
    description: In this example, the `FULLTEXTSCORE` function is used in the `ORDER BY RANK` clause, and `FULLTEXTCONTAINS` is used in the `WHERE` clause.
    query: |-
      SELECT TOP 10 c.text
      FROM c
      WHERE FULLTEXTCONTAINS(c.text, "keyword1")
      ORDER BY RANK FULLTEXTSCORE(c.text, "keyword1", "keyword2")
    result: |-
      -- Example result not available (result not provided in markdown)
remarks:
  - This function requires enrollment in the Azure Cosmos DB NoSQL Full Text Search feature.
  - This function requires a Full Text Index.
  - This function can only be used in an `ORDER BY RANK` clause, or as an argument in an `RRF` system function.
  - This function can’t be part of a projection (for example, `SELECT FullTextScore(c.text, "keyword") AS Score FROM c` is invalid).
related:
  - reference: system-functions.yml
  - reference: ../../gen-ai/full-text-search.md
