### YamlMime:NoSQLQueryReference
name: SQRT
group: mathematical
summary: An Azure Cosmos DB for NoSQL system function that returns the square root of the specified numeric value.
description: |
  The `SQRT` function returns the square root of the specified numeric value.
syntax: |
  SQRT(<numeric_expr>)
arguments:
  - name: numeric_expr
    required: true
    description: A numeric expression.
returns: |
  Returns a numeric expression.
examples:
  - title: Calculate square roots
    description: In this example, the `SQRT` function is used to return the square roots of various numeric values.
    query: |
      SELECT VALUE {
        sqrtZero: SQRT(0),
        sqrtOne: SQRT(1),
        sqrtFour: SQRT(4),
        sqrtPrime: SQRT(17),
        sqrtTwentyFive: SQRT(25)
      }
    result: |
      [
        {
          "sqrtZero": 0,
          "sqrtOne": 1,
          "sqrtFour": 2,
          "sqrtPrime": 4.123105625617661,
          "sqrtTwentyFive": 5
        }
      ]
remarks:
  - INCLUDE-NOTIFY-NO-INDEX-USAGE
related:
  - reference: power.yml
  - reference: abs.yml
