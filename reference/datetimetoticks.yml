### YamlMime:NoSQLQueryReference
name: DATETIMETOTICKS
group: date-and-time
description: |-
  The `DATETIMETOTICKS` function converts the specified DateTime to ticks. A single tick represents 100 nanoseconds or 0.0000001 of a second.
syntax: |-
  DATETIMETOTICKS(<date_time>)
arguments:
  - name: date_time
    required: true
    description: A Coordinated Universal Time (UTC) date and time string in the ISO 8601 format `YYYY-MM-DDThh:mm:ss.fffffffZ`.
returns: |-
  Returns a signed numeric value, the current number of 100-nanosecond ticks that have elapsed since the Unix epoch (January 1, 1970).
examples:
  - title: Convert date and time to ticks
    description: In this example, the `DATETIMETOTICKS` function is used to convert a date and time to ticks.
    query: |-
      SELECT VALUE {
        ticks: DATETIMETOTICKS("2015-05-19T12:00:00.0000000")
      }
    result: |-
      [
        {
          "ticks": 14320368000000000
        }
      ]
remarks:
  - INCLUDE-NOTIFY-NO-INDEX-USAGE
  - INCLUDE-DATE-FORMAT-ISO-8601-UNDEFINED
related:
