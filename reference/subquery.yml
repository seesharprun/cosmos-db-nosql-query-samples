### YamlMime:NoSQLQueryReference
name: SUBQUERY
group: clause
description: |-
  The `SUBQUERY` clause identifies a query nested within another query.
summary: |-
  Subqueries can be used for optimizing JOIN expressions, evaluating expensive expressions once and referencing them multiple times, and mimicking joins with external reference data. Only correlated subqueries are supported in Azure Cosmos DB for NoSQL.
syntax: |-
  (SELECT VALUE <expr> FROM <source> WHERE <condition>)
arguments:
  - name: expr
    required: true
    description: The expression to select in the subquery.
  - name: source
    required: true
    description: The source collection or array to select from.
  - name: condition
    required: false
    description: An optional condition to filter the subquery results.
returns: |-
  Returns a value or set of values depending on the subquery type (multi-value or scalar).
examples:
  - title: Optimize self-join expressions
    description: |-
      In this example, subqueries are used to optimize JOIN expressions by filtering joined array items before joining with the next expression.
    query: |-
      SELECT VALUE
          COUNT(1)
      FROM
          products p
      JOIN 
          (SELECT VALUE t FROM t IN p.tags WHERE t.name IN ("winter", "fall"))
      JOIN 
          (SELECT VALUE q FROM q IN p.onHandQuantities WHERE q.quantity BETWEEN 0 AND 10)
      JOIN 
          (SELECT VALUE s FROM s IN p.warehouseStock WHERE NOT s.backstock)
    result: |-
      [
        25
      ]
  - title: Scalar subquery with aggregate
    description: |-
      In this example, a scalar subquery is used to count all tags for each item.
    query: |-
      SELECT
          p.name,
          (SELECT VALUE COUNT(1) FROM i IN p.inventory) AS locationCount
      FROM
          products p
    result: |-
      [
        {
          "name": "Snow coat",
          "locationCount": 3
        }
      ]
related:
  - reference: join.yml
  - reference: select.yml
remarks:
  - Only correlated subqueries are supported in Azure Cosmos DB for NoSQL.
  - Multi-value subqueries are only valid in the FROM clause.
  - Scalar subqueries can be used in SELECT or WHERE clauses.
