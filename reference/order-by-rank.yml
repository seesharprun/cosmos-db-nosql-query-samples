### YamlMime:NoSQLQueryReference
name: ORDER-BY-RANK
group: clause
description: |
  The `ORDER BY RANK` clause returns the sorted result set of a query based on the rank of scoring functions.
syntax: |
  ORDER BY RANK <scoring function>
arguments:
  - name: scoring function
    required: true
    description: Specifies a scoring function like `VectorDistance`, `FullTextScore`, or `RRF`.
returns: |
  Returns the sorted result set based on the specified scoring function's rank.
examples:
  - title: Sort by scoring function rank
    description: In this example, the `ORDER BY RANK` clause is used to sort results by the rank of a scoring function.
    query: |
      -- Example query for ORDER BY RANK
      SELECT * FROM c ORDER BY RANK FullTextScore
    result: |
      [
        -- Example result set
      ]
remarks: []
related:
