### YamlMime:NoSQLQueryReference
name: IS_DEFINED
group: type-checking
summary: An Azure Cosmos DB for NoSQL system function that returns true if the property has been assigned a value.
description: |
  The `IS_DEFINED` function returns a boolean indicating if the property has been assigned a value.
syntax: |
  IS_DEFINED(<expr>)
arguments:
  - name: expr
    required: true
    description: Any expression.
returns: |
  Returns a boolean expression.
examples:
  - title: Check if property is defined
    description: In this example, the `IS_DEFINED` function is used to check for the presence of a property within a JSON document.
    query: |
      SELECT VALUE {
        isDefined: IS_DEFINED({ "quantity" : 5 }.quantity),
        isNotDefined: IS_DEFINED({ "quantity" : 5 }.name)
      }
    result: |
      [
        {
          "isDefined": true,
          "isNotDefined": false
        }
      ]
remarks:
  - This function benefits from the use of a range index. For more information, see [range indexes](/azure/cosmos-db/index-policy#includeexclude-strategy).
related:
  - reference: is-null.yml
  - reference: is-array.yml
