### YamlMime:NoSQLQueryReference
name: VECTORDISTANCE
summary: An Azure Cosmos DB for NoSQL system function that returns the similarity score between two vectors for one or more items in a container.
group: spatial
description: |-
  The `VECTORDISTANCE` function returns the similarity score between two specified vectors.
syntax: |-
  VECTORDISTANCE(<vector_expr_1>, <vector_expr_2>, <bool_expr>, <obj_expr>)
arguments:
  - name: vector_expr_1
    required: true
    description: An array of `float32` or smaller.
  - name: vector_expr_2
    required: true
    description: An array of `float32` or smaller.
  - name: bool_expr
    required: false
    description: An optional boolean specifying how the computed value is used in an ORDER BY expression. If `true`, then brute force is used. A value of `false` uses any index defined on the vector property, if it exists. Default value is `false`.
  - name: obj_expr
    required: false
    description: An optional JSON formatted object literal used to specify options for the vector distance calculation. Valid items include `distanceFunction`, `dataType`, and `searchListSizeMultiplier`.
returns: |-
  Returns a numeric expression that enumerates the similarity score between two expressions.
examples:
  - title: Vector similarity search
    description: In this example, the `VECTORDISTANCE` function is used to return the similarity score between a document vector and a query vector.
    query: |-
      SELECT
        c.name,
        VECTORDISTANCE(c.vector, [1,2,3]) AS SimilarityScore 
      FROM
        c
      ORDER BY VECTORDISTANCE(c.vector, [1,2,3]) AS SimilarityScore
    result: |-
      [
        {
          "name": "document1",
          "SimilarityScore": 0.8923471786
        },
        {
          "name": "document2",
          "SimilarityScore": 0.7492739573
        }
      ]
system:
  - SKIP-VALIDATION
related:
