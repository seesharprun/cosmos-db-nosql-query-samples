### YamlMime:NoSQLQueryReference
name: STRINGSPLIT
group: string
description: |
  The `STRINGSPLIT` function returns an array of substrings obtained from separating the source string by the specified delimiter.
summary: The `STRINGSPLIT` function returns an array of substrings obtained from separating the source string by the specified delimiter in Azure Cosmos DB for NoSQL.
syntax: |
  STRINGSPLIT(<string_expr1>, <string_expr2>)
arguments:
  - name: string_expr1
    required: true
    description: The source string expression to parse.
  - name: string_expr2
    required: true
    description: The string used as the delimiter.
returns: |
  Returns an array expression.
examples:
  - title: Split string into substrings
    description: |
      In this example, the `STRINGSPLIT` function is used to split a string into substrings using various delimiters.
    query: |
      SELECT VALUE {
        seperateOnLetter: STRINGSPLIT("Handlebar", "e"),
        seperateOnSymbol: STRINGSPLIT("CARBON_STEEL_BIKE_WHEEL", "_"),
        seperateOnWhitespace: STRINGSPLIT("Road Bike", " "),
        seperateOnPhrase: STRINGSPLIT("xenmoun mountain bike", "moun"),
        undefinedSeperator: STRINGSPLIT("AluminumBikeFrame", undefined),
        emptySeparatorString: STRINGSPLIT("Helmet", ""),
        emptySourceString: STRINGSPLIT("", "")
      }
    result: |
      [
        {
          "seperateOnLetter": [
            "Handl",
            "bar"
          ],
          "seperateOnSymbol": [
            "CARBON",
            "STEEL",
            "BIKE",
            "WHEEL"
          ],
          "seperateOnWhitespace": [
            "Road",
            "Bike"
          ],
          "seperateOnPhrase": [
            "xen",
            " ",
            "tain bike"
          ],
          "emptySeparatorString": [
            "Helmet"
          ],
          "emptySourceString": [
            ""
          ]
        }
      ]
remarks:
  - INCLUDE-NOTIFY-NO-INDEX-USAGE
related:
  - reference: stringjoin.yml
  - reference: concat.yml
  - reference: split.yml
