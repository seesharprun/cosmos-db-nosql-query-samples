### YamlMime:NoSQLQueryReference
name: INTBITOR
group: mathematical
description: |-
  The `INTBITOR` function returns the result of a bitwise inclusive OR operation on two integer values.
syntax: |-
  INTBITOR(<numeric_expr_1>, <numeric_expr_2>)
arguments:
  - name: numeric_expr_1
    required: true
    description: The first numeric expression.
  - name: numeric_expr_2
    required: true
    description: The second numeric expression.
returns: |-
  Returns a numeric expression.
examples:
  - title: Bitwise inclusive OR
    description: In this example, the `INTBITOR` function is used to perform a bitwise inclusive OR operation.
    query: |-
      SELECT VALUE {
        inclusiveOr: INTBITOR(56, 100),
        inclusiveOrSame: INTBITOR(56, 56),
        inclusiveOrZero: INTBITOR(56, 0),
        inclusiveOrDecimal: INTBITOR(56, 0.1)
      }
    result: |-
      [
        {
          "inclusiveOr": 124,
          "inclusiveOrSame": 56,
          "inclusiveOrZero": 56
        }
      ]
system:
  - SKIP-VALIDATION
remarks: []
related:
  - reference: intbitxor.yml
  - reference: intbitand.yml
