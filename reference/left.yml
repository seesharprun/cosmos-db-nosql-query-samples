### YamlMime:NoSQLQueryReference
name: LEFT
group: string
summary: An Azure Cosmos DB for NoSQL system function that returns a substring from the left side of a string.
description: |
  The `LEFT` function returns the left part of a string up to the specified number of characters.
syntax: |
  LEFT(<string_expr>, <numeric_expr>)
arguments:
  - name: string_expr
    required: true
    description: A string expression.
  - name: numeric_expr
    required: true
    description: A numeric expression specifying the number of characters to extract from `string_expr`.
returns: |
  Returns a string expression.
examples:
  - title: Get left part of string
    description: In this example, the `LEFT` function is used to return the left part of the string `AdventureWorks` for various length values.
    query: |
      SELECT VALUE {
        firstZero: LEFT("AdventureWorks", 0),
        firstOne: LEFT("AdventureWorks", 1),
        firstFive: LEFT("AdventureWorks", 5),
        fullLength: LEFT("AdventureWorks", LENGTH("AdventureWorks")),
        beyondMaxLength: LEFT("AdventureWorks", 100)
      }
    result: |
      [
        {
          "firstZero": "",
          "firstOne": "A",
          "firstFive": "Adven",
          "fullLength": "AdventureWorks",
          "beyondMaxLength": "AdventureWorks"
        }
      ]
remarks:
  - This function benefits from the use of a range index. For more information, see [range indexes](/azure/cosmos-db/index-policy#includeexclude-strategy).
related:
  - reference: right.yml
  - reference: substring.yml
