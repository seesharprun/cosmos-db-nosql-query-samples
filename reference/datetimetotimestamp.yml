### YamlMime:NoSQLQueryReference
name: DATETIMETOTIMESTAMP
group: date-and-time
description: |-
  The `DATETIMETOTIMESTAMP` function converts the specified date and time to a numeric timestamp. The timestamp is a signed numeric integer that measures the milliseconds since the Unix epoch.
syntax: |-
  DATETIMETOTIMESTAMP(<date_time>)
arguments:
  - name: date_time
    required: true
    description: A Coordinated Universal Time (UTC) date and time string in the ISO 8601 format `YYYY-MM-DDThh:mm:ss.fffffffZ`.
returns: |-
  Returns a signed numeric value, the current number of milliseconds that have elapsed since the Unix epoch (January 1, 1970).
examples:
  - title: Convert date and time to timestamp
    description: In this example, the `DATETIMETOTIMESTAMP` function is used to convert a date and time to a timestamp.
    query: |-
      SELECT VALUE {
        timestamp: DATETIMETOTIMESTAMP("2015-05-19T12:00:00.0000000")
      }
    result: |-
      [
        {
          "timestamp": 1432036800000
        }
      ]
remarks:
  - INCLUDE-DATE-FORMAT-ISO-8601-UNDEFINED
related:
