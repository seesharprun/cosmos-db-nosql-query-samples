### YamlMime:NoSQLQueryReference
name: TOSTRING
group: string
summary: An Azure Cosmos DB for NoSQL system function that returns a value converted to a string.
description: |
  The `TOSTRING` function returns a string representation of a value.
syntax: |
  TOSTRING(<expr>)
arguments:
  - name: expr
    required: true
    description: Any expression.
returns: |
  Returns a string expression.
examples:
  - title: Convert values to string
    description: In this example, the `TOSTRING` function is used to convert multiple scalar and object values to a string.
    query: |
      SELECT VALUE {
        integerToString: TOSTRING(125),
        floatToString: TOSTRING(0.1234),
        booleanToString: TOSTRING(false),
        arrayToString: TOSTRING([ 1, 2, 3 ]),
        objectToString: TOSTRING({ "department": "Bicycles" }),
        stringToString: TOSTRING("Hello World"),
        undefinedToString: TOSTRING(undefined),
        notANumberToString: TOSTRING(NaN),
        infinityToString: TOSTRING(Infinity)
      }
    result: |
      [
        {
          "integerToString": "125",
          "floatToString": "0.1234",
          "booleanToString": "false",
          "arrayToString": "[1,2,3]",
          "objectToString": "{\"department\":\"Bicycles\"}",
          "stringToString": "Hello World",
          "notANumberToString": "NaN",
          "infinityToString": "Infinity"
        }
      ]
remarks:
  - This function doesn't utilize the index.
related:
  - reference: is-object.yml
  - reference: tostring.yml
